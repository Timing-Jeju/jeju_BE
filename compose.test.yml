services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: timing_jeju_test
      POSTGRES_USER: timing_jeju_test
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./db/local-postgres/auth_compat.sql:/docker-entrypoint-initdb.d/001_auth_compat.sql:ro
      - ./supabase/migrations/20260728000000_initial_public_schema.sql:/docker-entrypoint-initdb.d/002_application_schema.sql:ro
      - ./supabase/migrations/20260730000000_database_integrity_hardening.sql:/docker-entrypoint-initdb.d/003_database_integrity_hardening.sql:ro
      - ./supabase/migrations/20260730010000_external_ingestion_foundation.sql:/docker-entrypoint-initdb.d/004_external_ingestion_foundation.sql:ro
      - ./supabase/migrations/20260730020000_ingestion_consistency_hardening.sql:/docker-entrypoint-initdb.d/005_ingestion_consistency_hardening.sql:ro
      - ./supabase/migrations/20260730030000_schedule_consistency_hardening.sql:/docker-entrypoint-initdb.d/006_schedule_consistency_hardening.sql:ro
      - ./supabase/migrations/20260730040000_import_run_lineage_retention.sql:/docker-entrypoint-initdb.d/007_import_run_lineage_retention.sql:ro
      - ./supabase/migrations/20260810000000_api_idempotency_registry.sql:/docker-entrypoint-initdb.d/008_api_idempotency_registry.sql:ro
      - ./supabase/migrations/20260811000000_async_run_worker_runtime.sql:/docker-entrypoint-initdb.d/009_async_run_worker_runtime.sql:ro
      - ./supabase/migrations/20260813000000_import_run_lifecycle_fencing.sql:/docker-entrypoint-initdb.d/010_import_run_lifecycle_fencing.sql:ro
      - ./supabase/migrations/20260813010000_external_snapshot_storage.sql:/docker-entrypoint-initdb.d/011_external_snapshot_storage.sql:ro
      - ./supabase/migrations/20260814000000_tour_api_operation_provenance.sql:/docker-entrypoint-initdb.d/012_tour_api_operation_provenance.sql:ro
      - ./supabase/migrations/20260816000000_tour_api_detail_info_operation.sql:/docker-entrypoint-initdb.d/013_tour_api_detail_info_operation.sql:ro
      - ./supabase/migrations/20260817000000_tour_api_place_images_operation.sql:/docker-entrypoint-initdb.d/014_tour_api_place_images_operation.sql:ro
      - ./supabase/migrations/20260818000000_tour_api_incremental_sync.sql:/docker-entrypoint-initdb.d/015_tour_api_incremental_sync.sql:ro
      - ./supabase/migrations/20260819000000_tago_stop_import.sql:/docker-entrypoint-initdb.d/016_tago_stop_import.sql:ro
      - ./supabase/migrations/20260820000000_tago_route_stops_import.sql:/docker-entrypoint-initdb.d/017_tago_route_stops_import.sql:ro
      - ./supabase/migrations/20260820000001_kma_village_forecast_version.sql:/docker-entrypoint-initdb.d/018_kma_village_forecast_version.sql:ro
      - ./supabase/migrations/20260822000000_place_stop_postgis_links.sql:/docker-entrypoint-initdb.d/020_place_stop_postgis_links.sql:ro
      - ./supabase/migrations/20260823000000_recommended_stay_policy.sql:/docker-entrypoint-initdb.d/021_recommended_stay_policy.sql:ro
      - ./supabase/migrations/20260824000000_tourapi_discovery_import_checkpoints.sql:/docker-entrypoint-initdb.d/022_tourapi_discovery_import_checkpoints.sql:ro
      - ./supabase/migrations/20260825000000_public_place_tombstone.sql:/docker-entrypoint-initdb.d/023_public_place_tombstone.sql:ro
      - ./supabase/migrations/20260826000000_tago_arrival_cache.sql:/docker-entrypoint-initdb.d/024_tago_arrival_cache.sql:ro
      - ./supabase/migrations/20260827000000_tago_arrival_flight_state.sql:/docker-entrypoint-initdb.d/025_tago_arrival_flight_state.sql:ro
      - ./supabase/migrations/20260828000000_completed_provider_data_health_index.sql:/docker-entrypoint-initdb.d/026_completed_provider_data_health_index.sql:ro
      - ./supabase/migrations/20260829000000_completed_provider_snapshot_retention_index.sql:/docker-entrypoint-initdb.d/027_completed_provider_snapshot_retention_index.sql:ro
      - ./supabase/migrations/20260830000000_schedule_revision_run_foundation.sql:/docker-entrypoint-initdb.d/028_schedule_revision_run_foundation.sql:ro
      - ./supabase/migrations/20260831000000_compute_run_input_snapshot.sql:/docker-entrypoint-initdb.d/029_compute_run_input_snapshot.sql:ro
      - ./supabase/migrations/20260901000000_legal_documents_consents.sql:/docker-entrypoint-initdb.d/030_legal_documents_consents.sql:ro
      - ./supabase/migrations/20260902000000_trip_create_contract.sql:/docker-entrypoint-initdb.d/031_trip_create_contract.sql:ro
      - ./supabase/migrations/20260903000000_saved_places_api.sql:/docker-entrypoint-initdb.d/032_saved_places_api.sql:ro
      - ./supabase/migrations/20260904000000_push_device_notification_preferences.sql:/docker-entrypoint-initdb.d/033_push_device_notification_preferences.sql:ro
      - ./supabase/migrations/20260904000001_push_notification_server_writer_boundary.sql:/docker-entrypoint-initdb.d/034_push_notification_server_writer_boundary.sql:ro
      - ./supabase/migrations/20260905000000_mcp_private_http_client.sql:/docker-entrypoint-initdb.d/035_mcp_private_http_client.sql:ro
      - ./supabase/migrations/20260906000000_trip_update_delete_contract.sql:/docker-entrypoint-initdb.d/036_trip_update_delete_contract.sql:ro
      - ./supabase/migrations/20260907000000_schedule_item_create_contract.sql:/docker-entrypoint-initdb.d/037_schedule_item_create_contract.sql:ro
      - ./supabase/migrations/20260907000002_trip_accommodation_contract.sql:/docker-entrypoint-initdb.d/039_trip_accommodation_contract.sql:ro
      - ./supabase/migrations/20260907000003_trip_preferences_replace_contract.sql:/docker-entrypoint-initdb.d/040_trip_preferences_replace_contract.sql:ro
      - ./supabase/migrations/20260907000004_trip_preferences_owner_read_helper.sql:/docker-entrypoint-initdb.d/041_trip_preferences_owner_read_helper.sql:ro
      - ./supabase/migrations/20260907000005_trip_transport_event_contract.sql:/docker-entrypoint-initdb.d/042_trip_transport_event_contract.sql:ro
      - ./supabase/migrations/20260908000000_trip_place_preference_contract.sql:/docker-entrypoint-initdb.d/043_trip_place_preference_contract.sql:ro
      - ./supabase/migrations/20260909000000_trip_calendar_child_invariant_correction.sql:/docker-entrypoint-initdb.d/044_trip_calendar_child_invariant_correction.sql:ro
      - ./db/local-postgres/seed_fixtures.sql:/docker-entrypoint-initdb.d/099_seed_fixtures.sql:ro
      - ./db/queries:/queries:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timing_jeju_test -d timing_jeju_test"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: services/spring-api/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/timing_jeju_test
      SPRING_DATASOURCE_USERNAME: timing_jeju_test
      SPRING_DATASOURCE_PASSWORD: test-only-password
      SUPABASE_JWT_ISSUER: https://test.supabase.invalid/auth/v1
      SUPABASE_JWT_AUDIENCE: authenticated
      SUPABASE_JWKS_URL: https://test.supabase.invalid/auth/v1/.well-known/jwks.json
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      APP_SOCIAL_LOGIN_PROVIDER_IDS: google,kakao,custom:naver
      PUSH_TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      FCM_ENABLED: "false"
      SAVED_PLACE_RETENTION_ENABLED: "true"
      SAVED_PLACE_RETENTION_INITIAL_DELAY: PT24H
      APP_TRIPS_CURSOR_SIGNING_KEY: test-only-trip-cursor-signing-key-at-least-32-bytes
      TOUR_API_ENABLED: "false"
      TOUR_API_API_KEY: ""
      TOUR_API_BASE_URL: https://apis.data.go.kr/B551011/KorService2
      TOUR_API_CONNECT_TIMEOUT: 2s
      TOUR_API_READ_TIMEOUT: 5s
      TAGO_ENABLED: "false"
      TAGO_API_KEY: ""
      TAGO_BASE_URL: https://apis.data.go.kr/1613000
      TAGO_CONNECT_TIMEOUT: 2s
      TAGO_READ_TIMEOUT: 5s
      TMAP_ENABLED: "false"
      TMAP_API_KEY: ""
      TMAP_BASE_URL: https://apis.openapi.sk.com
      TMAP_CONNECT_TIMEOUT: 2s
      TMAP_READ_TIMEOUT: 5s
      KMA_ENABLED: "false"
      KMA_API_KEY: ""
      KMA_BASE_URL: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
      KMA_CONNECT_TIMEOUT: 2s
      KMA_READ_TIMEOUT: 5s
    ports:
      - "127.0.0.1:${TIMING_JEJU_SMOKE_API_PORT:-28080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 3s
      timeout: 3s
      retries: 30
