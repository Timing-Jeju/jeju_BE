services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: timing_jeju_test
      POSTGRES_USER: timing_jeju_test
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timing_jeju_test -d timing_jeju_test"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/timing_jeju_test
      SPRING_DATASOURCE_USERNAME: timing_jeju_test
      SPRING_DATASOURCE_PASSWORD: test-only-password
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 3s
      timeout: 3s
      retries: 30
