services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: timing_jeju_test
      POSTGRES_USER: timing_jeju_test
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./db/local-postgres/auth_compat.sql:/docker-entrypoint-initdb.d/001_auth_compat.sql:ro
      - ./supabase/migrations/20260728000000_initial_public_schema.sql:/docker-entrypoint-initdb.d/002_application_schema.sql:ro
      - ./db/local-postgres/seed_fixtures.sql:/docker-entrypoint-initdb.d/003_seed_fixtures.sql:ro
      - ./db/queries:/queries:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timing_jeju_test -d timing_jeju_test"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./services/spring-api
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/timing_jeju_test
      SPRING_DATASOURCE_USERNAME: timing_jeju_test
      SPRING_DATASOURCE_PASSWORD: test-only-password
      SUPABASE_JWT_ISSUER: https://test.supabase.invalid/auth/v1
      SUPABASE_JWT_AUDIENCE: authenticated
      SUPABASE_JWKS_URL: https://test.supabase.invalid/auth/v1/.well-known/jwks.json
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      APP_SOCIAL_LOGIN_PROVIDER_IDS: google,kakao,custom:naver
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 3s
      timeout: 3s
      retries: 30
