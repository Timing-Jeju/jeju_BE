name: 백엔드 CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  pr-metadata:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: 저장소 Checkout
        uses: actions/checkout@v4
      - name: PR 제목·Issue·Release 경로 검증
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
        run: python3 scripts/github/validate-pr-metadata.py --title "$PR_TITLE" --body "$PR_BODY" --base "$PR_BASE" --head "$PR_HEAD"

  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 저장소 Checkout
        uses: actions/checkout@v4
      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle Wrapper 무결성 검증
        uses: gradle/actions/wrapper-validation@v4
      - name: Gradle 캐시 설정
        uses: gradle/actions/setup-gradle@v4
      - name: 실행 권한 설정
        run: chmod +x gradlew scripts/*.sh scripts/git-hooks/*.py
      - name: 로컬과 동일한 전체 품질 게이트
        run: ./scripts/quality-gate.sh --ci
      - name: 테스트 리포트 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            build/reports/tests/
            build/reports/jacoco/
          if-no-files-found: warn
          retention-days: 14
