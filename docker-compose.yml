services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: timing-jeju-postgres
    environment:
      POSTGRES_DB: timing_jeju
      POSTGRES_USER: timing_jeju
      POSTGRES_PASSWORD: timing_jeju
    ports:
      - "5433:5432"
    volumes:
      - timing-jeju-postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/queries:/queries:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timing_jeju -d timing_jeju"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  timing-jeju-postgres-data:
