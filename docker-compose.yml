services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: timing-jeju-postgres
    environment:
      POSTGRES_DB: timing_jeju
      POSTGRES_USER: timing_jeju
      POSTGRES_PASSWORD: timing_jeju
    ports:
      - "5433:5432"
    volumes:
      - timing-jeju-postgres-data:/var/lib/postgresql/data
      - ./db/local-postgres/auth_compat.sql:/docker-entrypoint-initdb.d/001_auth_compat.sql:ro
      - ./supabase/migrations/20260728000000_initial_public_schema.sql:/docker-entrypoint-initdb.d/002_application_schema.sql:ro
      - ./supabase/migrations/20260730000000_database_integrity_hardening.sql:/docker-entrypoint-initdb.d/003_database_integrity_hardening.sql:ro
      - ./supabase/migrations/20260730010000_external_ingestion_foundation.sql:/docker-entrypoint-initdb.d/004_external_ingestion_foundation.sql:ro
      - ./supabase/migrations/20260730020000_ingestion_consistency_hardening.sql:/docker-entrypoint-initdb.d/005_ingestion_consistency_hardening.sql:ro
      - ./supabase/migrations/20260730030000_schedule_consistency_hardening.sql:/docker-entrypoint-initdb.d/006_schedule_consistency_hardening.sql:ro
      - ./supabase/migrations/20260730040000_import_run_lineage_retention.sql:/docker-entrypoint-initdb.d/007_import_run_lineage_retention.sql:ro
      - ./supabase/migrations/20260810000000_api_idempotency_registry.sql:/docker-entrypoint-initdb.d/008_api_idempotency_registry.sql:ro
      - ./supabase/migrations/20260811000000_async_run_worker_runtime.sql:/docker-entrypoint-initdb.d/009_async_run_worker_runtime.sql:ro
      - ./supabase/migrations/20260813000000_import_run_lifecycle_fencing.sql:/docker-entrypoint-initdb.d/010_import_run_lifecycle_fencing.sql:ro
      - ./supabase/migrations/20260813010000_external_snapshot_storage.sql:/docker-entrypoint-initdb.d/011_external_snapshot_storage.sql:ro
      - ./supabase/migrations/20260814000000_tour_api_operation_provenance.sql:/docker-entrypoint-initdb.d/012_tour_api_operation_provenance.sql:ro
      - ./supabase/migrations/20260816000000_tour_api_detail_info_operation.sql:/docker-entrypoint-initdb.d/013_tour_api_detail_info_operation.sql:ro
      - ./supabase/migrations/20260817000000_tour_api_place_images_operation.sql:/docker-entrypoint-initdb.d/014_tour_api_place_images_operation.sql:ro
      - ./supabase/migrations/20260818000000_tour_api_incremental_sync.sql:/docker-entrypoint-initdb.d/015_tour_api_incremental_sync.sql:ro
      - ./supabase/migrations/20260819000000_tago_stop_import.sql:/docker-entrypoint-initdb.d/016_tago_stop_import.sql:ro
      - ./supabase/migrations/20260820000000_tago_route_stops_import.sql:/docker-entrypoint-initdb.d/017_tago_route_stops_import.sql:ro
      - ./supabase/migrations/20260820000001_kma_village_forecast_version.sql:/docker-entrypoint-initdb.d/018_kma_village_forecast_version.sql:ro
      - ./db/local-postgres/seed_fixtures.sql:/docker-entrypoint-initdb.d/019_seed_fixtures.sql:ro
      - ./db/queries:/queries:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timing_jeju -d timing_jeju"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  timing-jeju-postgres-data:
