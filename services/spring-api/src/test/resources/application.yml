spring:
  datasource:
    url: jdbc:h2:mem:timing-jeju-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    info:
      enabled: true
  health:
    db:
      enabled: false

app:
  social-login:
    enabled-provider-ids: google,kakao,custom:naver
    redirect-urls: http://127.0.0.1:3000/auth/callback
  security:
    jwt:
      issuer: ${SUPABASE_JWT_ISSUER:https://test.supabase.invalid/auth/v1}
      audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
      jwks-url: ${SUPABASE_JWKS_URL:https://test.supabase.invalid/auth/v1/.well-known/jwks.json}
      secret: ${SUPABASE_JWT_SECRET:}
      clock-skew: 30s
    cors:
      allowed-origins: http://localhost:3000
