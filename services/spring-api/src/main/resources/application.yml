spring:
  application:
    name: timing-jeju-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/timing_jeju}
    username: ${SPRING_DATASOURCE_USERNAME:timing_jeju}
    password: ${SPRING_DATASOURCE_PASSWORD:timing_jeju}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
    info:
      enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
  paths-to-match: /api/v1/**

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO

app:
  snapshot-retention:
    enabled: ${SNAPSHOT_RETENTION_ENABLED:false}
    dry-run: ${SNAPSHOT_RETENTION_DRY_RUN:true}
    batch-size: ${SNAPSHOT_RETENTION_BATCH_SIZE:500}
  data-health:
    actuator:
      enabled: ${APP_DATA_HEALTH_ACTUATOR_ENABLED:false}
  places:
    cursor-signing-key: ${APP_PLACES_CURSOR_SIGNING_KEY:}
  external-api:
    tour-api:
      enabled: ${TOUR_API_ENABLED:false}
      api-key: ${TOUR_API_API_KEY:}
      base-url: ${TOUR_API_BASE_URL:}
      connect-timeout: ${TOUR_API_CONNECT_TIMEOUT:2s}
      read-timeout: ${TOUR_API_READ_TIMEOUT:5s}
    tago:
      enabled: ${TAGO_ENABLED:false}
      api-key: ${TAGO_API_KEY:}
      base-url: ${TAGO_BASE_URL:}
      connect-timeout: ${TAGO_CONNECT_TIMEOUT:2s}
      read-timeout: ${TAGO_READ_TIMEOUT:5s}
    tmap:
      enabled: ${TMAP_ENABLED:false}
      api-key: ${TMAP_API_KEY:}
      base-url: ${TMAP_BASE_URL:}
      connect-timeout: ${TMAP_CONNECT_TIMEOUT:2s}
      read-timeout: ${TMAP_READ_TIMEOUT:5s}
    kma:
      enabled: ${KMA_ENABLED:false}
      api-key: ${KMA_API_KEY:}
      base-url: ${KMA_BASE_URL:}
      connect-timeout: ${KMA_CONNECT_TIMEOUT:2s}
      read-timeout: ${KMA_READ_TIMEOUT:5s}
  social-login:
    provider-ids: ${APP_SOCIAL_LOGIN_PROVIDER_IDS:google,kakao,custom:naver}
  stay-policy:
    import:
      enabled: ${STAY_POLICY_IMPORT_ENABLED:false}
      root: ${STAY_POLICY_IMPORT_ROOT:}
      file: ${STAY_POLICY_IMPORT_FILE:}
      version: ${STAY_POLICY_IMPORT_VERSION:}
      effective-at: ${STAY_POLICY_IMPORT_EFFECTIVE_AT:}
      expected-active-version: ${STAY_POLICY_IMPORT_EXPECTED_ACTIVE_VERSION:}
      dry-run: ${STAY_POLICY_IMPORT_DRY_RUN:true}
  security:
    jwt:
      mode: jwks
      issuer: ${SUPABASE_JWT_ISSUER:}
      audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
      jwks-url: ${SUPABASE_JWKS_URL:}
      secret: ${SUPABASE_JWT_SECRET:}
      clock-skew: 30s
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

server:
  shutdown: graceful
