spring:
  application:
    name: timing-jeju-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/timing_jeju}
    username: ${SPRING_DATASOURCE_USERNAME:timing_jeju}
    password: ${SPRING_DATASOURCE_PASSWORD:timing_jeju}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
    info:
      enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
  paths-to-match: /api/v1/**

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO

app:
  social-login:
    provider-ids: ${APP_SOCIAL_LOGIN_PROVIDER_IDS:google,kakao,custom:naver}
  security:
    jwt:
      mode: jwks
      issuer: ${SUPABASE_JWT_ISSUER:}
      audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
      jwks-url: ${SUPABASE_JWKS_URL:}
      secret: ${SUPABASE_JWT_SECRET:}
      clock-skew: 30s
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

server:
  shutdown: graceful
