plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.8.0'
}

group = 'com.timingjeju'
version = '0.0.1-SNAPSHOT'
description = 'Timing Jeju backend API'

ext {
	minimumCoverage = 0.90
	archUnitVersion = '1.4.2'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation "com.tngtech.archunit:archunit-junit5:${archUnitVersion}"
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

spotless {
	java {
		googleJavaFormat('1.28.0')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
	format 'misc', {
		target '*.gradle', '*.md', '.gitignore', '.gitattributes', '.editorconfig', '**/*.yml', '**/*.yaml', '**/*.json', '**/*.toml'
		targetExclude 'docs/**/*.md', '.agents/**/*.md', 'AGENTS.md', 'README.md', 'CONTRIBUTING.md', 'SECURITY.md'
		trimTrailingWhitespace()
		endWithNewline()
	}
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	testLogging {
		events 'failed', 'skipped'
		exceptionFormat 'full'
	}
}

def taggedTest = { String taskName, String tag, String descriptionText ->
	tasks.register(taskName, Test) {
		description = descriptionText
		group = 'verification'
		testClassesDirs = sourceSets.test.output.classesDirs
		classpath = sourceSets.test.runtimeClasspath
		useJUnitPlatform {
			includeTags tag
		}
		shouldRunAfter tasks.test
	}
}

taggedTest('unitTest', 'unit', '도메인 및 서비스 단위 테스트를 실행합니다.')
taggedTest('sliceTest', 'slice', 'Controller/Repository 슬라이스 테스트를 실행합니다.')
def integrationTestTask = taggedTest('integrationTest', 'integration', '통합 테스트를 실행합니다.')
taggedTest('architectureTest', 'architecture', 'ArchUnit 아키텍처 테스트를 실행합니다.')

def openApiOutput = layout.buildDirectory.file('openapi/openapi.json')
integrationTestTask.configure {
	outputs.file openApiOutput
}

tasks.register('openApiDocs') {
	description = '프론트엔드 공유용 OpenAPI JSON을 생성합니다.'
	group = 'documentation'
	dependsOn integrationTestTask
	outputs.file openApiOutput
	doLast {
		if (!openApiOutput.get().asFile.isFile()) {
			throw new GradleException('OpenAPI JSON이 생성되지 않았습니다.')
		}
	}
}

jacoco {
	toolVersion = '0.8.13'
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

jacocoTestCoverageVerification {
	dependsOn test
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = minimumCoverage
			}
		}
	}
}

check {
	dependsOn spotlessCheck, jacocoTestReport, jacocoTestCoverageVerification, openApiDocs
}
