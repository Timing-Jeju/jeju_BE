plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.8.0'
}

group = 'com.timingjeju'
version = '0.0.1-SNAPSHOT'
description = 'Timing Jeju backend API'

ext {
	minimumCoverage = 0.90
	archUnitVersion = '1.4.2'
	firebaseAdminVersion = '9.10.0'
	springAiVersion = '2.0.1'
	jsonSchemaValidatorVersion = '3.0.7'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

sourceSets {
	main {
		resources {
			srcDir file('../../docs/contracts')
		}
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation "org.springframework.ai:spring-ai-starter-mcp-client-webflux:${springAiVersion}"
	implementation "com.networknt:json-schema-validator:${jsonSchemaValidatorVersion}"
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'org.jsoup:jsoup:1.21.2'
	implementation('com.google.firebase:firebase-admin') {
		version {
			strictly firebaseAdminVersion
		}
	}
	implementation 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation "com.tngtech.archunit:archunit-junit5:${archUnitVersion}"
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

spotless {
	java {
		googleJavaFormat('1.28.0')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
	format 'misc', {
		target '*.gradle', '*.md', '.gitignore', '.gitattributes', '.editorconfig', '**/*.yml', '**/*.yaml', '**/*.json', '**/*.toml'
		targetExclude 'docs/**/*.md', '.agents/**/*.md', 'AGENTS.md', 'README.md', 'CONTRIBUTING.md', 'SECURITY.md'
		trimTrailingWhitespace()
		endWithNewline()
	}
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	afterSuite { descriptor, result ->
		if (descriptor.parent == null) {
			logger.lifecycle("TIMING_JEJU_TEST_ROOT_COMPLETE task=${path}")
		}
	}
	testLogging {
		events 'failed', 'skipped'
		exceptionFormat 'full'
	}
}

def taggedTest = { String taskName, String tag, String descriptionText ->
	tasks.register(taskName, Test) {
		description = descriptionText
		group = 'verification'
		testClassesDirs = sourceSets.test.output.classesDirs
		classpath = sourceSets.test.runtimeClasspath
		useJUnitPlatform {
			includeTags tag
		}
		shouldRunAfter tasks.test
	}
}

taggedTest('unitTest', 'unit', '도메인 및 서비스 단위 테스트를 실행합니다.')
taggedTest('sliceTest', 'slice', 'Controller/Repository 슬라이스 테스트를 실행합니다.')
def integrationTestTask = taggedTest('integrationTest', 'integration', '통합 테스트를 실행합니다.')
taggedTest('architectureTest', 'architecture', 'ArchUnit 아키텍처 테스트를 실행합니다.')

def openApiWriterClass = 'com.timingjeju.api.documentation.OpenApiDocumentationTest'

def repositoryTestSchema = files(
	file('../../db/local-postgres/auth_compat.sql'),
	fileTree('../../supabase/migrations') {
		include '*.sql'
	}
)

integrationTestTask.configure {
	inputs.files(repositoryTestSchema).withPathSensitivity(PathSensitivity.RELATIVE)
	filter {
		excludeTestsMatching openApiWriterClass
	}
}
tasks.named('test', Test) {
	inputs.files(repositoryTestSchema).withPathSensitivity(PathSensitivity.RELATIVE)
	useJUnitPlatform {
		excludeTags 'integration'
	}
}

def openApiOutput = layout.buildDirectory.file('openapi/openapi.json')
def openApiDocsTestTask = tasks.register('openApiDocsTest', Test) {
	description = 'OpenAPI JSON writer 통합 테스트만 실행합니다.'
	group = 'documentation'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	filter {
		includeTestsMatching openApiWriterClass
	}
	shouldRunAfter integrationTestTask
	outputs.file openApiOutput
	outputs.upToDateWhen { false }
	doFirst {
		delete openApiOutput
	}
	doLast {
		File output = openApiOutput.get().asFile
		if (!output.isFile() || output.length() == 0) {
			throw new GradleException('OpenAPI JSON이 생성되지 않았거나 비어 있습니다.')
		}
	}
}

tasks.register('openApiDocs') {
	description = '프론트엔드 공유용 OpenAPI JSON을 생성합니다.'
	group = 'documentation'
	dependsOn openApiDocsTestTask
	inputs.file openApiOutput
	doLast {
		File output = openApiOutput.get().asFile
		if (!output.isFile() || output.length() == 0) {
			throw new GradleException('OpenAPI JSON이 생성되지 않았거나 비어 있습니다.')
		}
	}
}

jacoco {
	toolVersion = '0.8.13'
}

def requiredCoverageTaskNames = [
	'unitTest',
	'sliceTest',
	'integrationTest',
	'openApiDocsTest',
	'architectureTest',
	'test'
]
def requiredCoverageTestTasks = requiredCoverageTaskNames.collect { taskName ->
	tasks.named(taskName, Test)
}
def requiredCoverageExecutionData = requiredCoverageTaskNames.collect { taskName ->
	layout.buildDirectory.file("jacoco/${taskName}.exec")
}
def verifyRequiredCoverageExecutionData = tasks.register('verifyRequiredCoverageExecutionData') {
	description = '현재 품질 게이트의 필수 JaCoCo execution data를 검증합니다.'
	group = 'verification'
	inputs.files(requiredCoverageExecutionData)
	mustRunAfter requiredCoverageTestTasks
	doLast {
		requiredCoverageExecutionData.each { executionData ->
			File executionFile = executionData.get().asFile
			if (!executionFile.isFile() || executionFile.length() == 0) {
				throw new GradleException("필수 JaCoCo execution data가 없거나 비어 있습니다: ${executionFile.name}")
			}
		}
	}
}

jacocoTestReport {
	dependsOn verifyRequiredCoverageExecutionData
	executionData requiredCoverageExecutionData
	reports {
		xml.required = true
		html.required = true
	}
}

jacocoTestCoverageVerification {
	dependsOn verifyRequiredCoverageExecutionData
	executionData requiredCoverageExecutionData
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = minimumCoverage
			}
		}
	}
}

check {
	dependsOn requiredCoverageTestTasks
	dependsOn spotlessCheck, jacocoTestReport, jacocoTestCoverageVerification, integrationTestTask, openApiDocs
}
